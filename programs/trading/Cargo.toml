[package]
name = "trading"
version = "0.1.1"
description = "Trading program for P2P Energy Trading - Order book and marketplace"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "trading"

[features]
cpi = ["no-entrypoint"]
no-entrypoint = []
anchor-debug = []
custom-panic = []
custom-heap = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
localnet = ["compute-debug/localnet"]
# Shielded-transfer (private_transfer) support. OFF by default: Phase 1 verifies
# conservation + balance PoK but NOT range proofs, so it is not mainnet-sound
# yet (see src/zk_verify.rs). Enable only for Phase-1 testing.
privacy = ["dep:solana-curve25519", "dep:curve25519-dalek", "dep:sha2"]

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.0", features = ["metadata"] }

# Build-constraint pins (NOT used directly in src): force an SBF-compatible blake3
# via the solana-blake3-hasher transitive chain, and pin proc-macro-crate for the
# anchor-derive toolchain. Do not remove — removing breaks SBF resolution.
blake3 = "=1.5.5"
proc-macro-crate = "^3.4.0"

bytemuck = { version = "1.16", features = ["derive"] }
compute-debug = { path = "../../shared/compute-debug", optional = true }

# Shielded-transfer verification (`privacy` feature only). solana-curve25519 gives
# ristretto point ops via curve25519 syscalls on-chain (host impl off-target, so
# these unit-test natively); curve25519-dalek does the scalar reduction; sha2 the
# Fiat–Shamir challenge. Versions pinned to the solana-zk-token-sdk 2.3.x family
# so the Pedersen generators match the wasm-zk prover.
solana-curve25519 = { version = "2.3.13", optional = true }
curve25519-dalek = { version = "=4.1.3", optional = true }
sha2 = { version = "0.10", optional = true }
governance = { path = "../governance", features = ["cpi"] }
treasury = { path = "../treasury", features = ["cpi"] }

# Solana release builds default to overflow-checks=off (silent wrapping).
# Force checked arithmetic so bare +=/-= panic instead of corrupting state.
[profile.release]
overflow-checks = true

# Host-only: build real ZK ElGamal Proof Program context-state accounts in the
# zk_verify range-context tests. Not linked into the on-chain .so.
[dev-dependencies]
solana-zk-sdk = "2.3.13"
